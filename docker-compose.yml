# Synology Container Manager 可匯入此檔（專案 → 建立 → 建立專案）
services:
  pcc-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: pcc-scraper:latest
    container_name: pcc-scraper
    # DS423 為 ARM64；在 NAS 上 build 可刪除整段 platform
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Taipei
      DATA_DIR: /app/data
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      CHROMIUM_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    shm_size: "512mb"
